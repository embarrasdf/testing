[versions]
embarrasdf-gradle-plugins = "0.0.129"
kotlinx-coroutines-test = "1.11.0"
junit4 = "4.13.2"
junit-jupiter-api = "6.1.0"

[libraries]
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter-api" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
embarrasdf-github-release = { id = "com.embarrasdf.gradle.plugin.github.release", version.ref = "embarrasdf-gradle-plugins" }
embarrasdf-jvm-library = { id = "com.embarrasdf.gradle.plugin.jvm.library", version.ref = "embarrasdf-gradle-plugins" }
embarrasdf-kotlin-multiplatform-library = { id = "com.embarrasdf.gradle.plugin.kotlin.multiplatform.library", version.ref = "embarrasdf-gradle-plugins" }
embarrasdf-maven-publish = { id = "com.embarrasdf.gradle.plugin.maven.publish", version.ref = "embarrasdf-gradle-plugins" }

[bundles]
